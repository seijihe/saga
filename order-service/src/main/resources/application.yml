server:
  port: 3000

spring:

  kafka:
    bootstrap-servers:
      - ${KAFKA_BROKER:localhost:9092}
    topic:
      start-saga: start-saga
      notify-ending: notify-ending
    consumer:
      group-id: order-group
      auto-offset-reset: latest # If any problems accours, will be reprocessed by the latest event

  mongodb:
    database: admin
    uri: ${MONGO_DB_URI:mongodb}://${MONGO_DB_USER:mongo}:${MONGO_DB_PASSWORD:mongo}@${MONGO_DB_HOST:localhost}:${MONGO_DB_PORT:27017}

logging:
  level: 
    org:
      apache:
        kafka: INFO # To remove the several logs generated by Kafka